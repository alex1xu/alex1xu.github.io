name: Update OSS tracker

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17 (best-effort; GitHub may delay under load)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-oss
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh OSS data
        run: node scripts/fetch-oss.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and trigger deploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/oss.json; then
            echo "No change to src/data/oss.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/oss.json
          git commit -m "chore: refresh OSS tracker data"
          git push
          # GITHUB_TOKEN-authored pushes don't trigger other workflows, so kick
          # the Pages deploy explicitly. Dispatch by filename (rename-resilient).
          gh workflow run deploy.yml
