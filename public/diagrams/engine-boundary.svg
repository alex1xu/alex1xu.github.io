  </style><g class="node "><rect x="35" y="158" width="105" height="60" rx="8"/><text x="87.5" y="183" class="node-title" text-anchor="middle">clients</text><text x="87.5" y="201" class="node-note" text-anchor="middle">WebSocket</text></g><g class="node "><rect x="190" y="148" width="128" height="80" rx="8"/><text x="254" y="183" class="node-title" text-anchor="middle">ingress</text><text x="254" y="201" class="node-note" text-anchor="middle">sequence commands</text></g><g class="node accent"><rect x="374" y="130" width="160" height="116" rx="8"/><text x="454" y="183" class="node-title" text-anchor="middle">engine</text><text x="454" y="201" class="node-note" text-anchor="middle">books · risk · wallets</text></g><g class="node "><rect x="592" y="110" width="122" height="58" rx="8"/><text x="653" y="134" class="node-title" text-anchor="middle">reliable</text><text x="653" y="152" class="node-note" text-anchor="middle">acks · fills</text></g><g class="node "><rect x="592" y="230" width="122" height="58" rx="8"/><text x="653" y="254" class="node-title" text-anchor="middle">market data</text><text x="653" y="272" class="node-note" text-anchor="middle">20 Hz snapshots</text></g><g class="node good"><rect x="190" y="294" width="128" height="58" rx="8"/><text x="254" y="318" class="node-title" text-anchor="middle">journal</text><text x="254" y="336" class="node-note" text-anchor="middle">replay input</text></g>
