<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Sharding the delivery stage</title><desc id="desc">Sharding the delivery stage</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6"/></marker></defs>
  <style>
    svg { background: #fffdf8; } .node rect { fill:#fffdf8; stroke:#2f302d; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .node.accent rect,.accent { stroke:#b85c38; fill:#fff1e8; } .node.good rect,.good { stroke:#557a61; fill:#edf5ed; } .node.warn rect,.warn { stroke:#a45a35; fill:#fff0e8; }
    .arrow { fill:none; stroke:#2f302d; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; } .arrow.dashed { stroke-dasharray:7 6; } .arrow.accent { stroke:#b85c38; }
    .label,.node-title,.node-note,.caption,.value { fill:#2f302d; font-family: ui-rounded, 'Comic Sans MS', sans-serif; } .label { font-size:16px; font-weight:650; } .node-title { font-size:16px; font-weight:700; } .node-note { font-size:12px; fill:#62645e; } .caption { font-size:14px; fill:#62645e; } .value { font-size:14px; font-weight:700; } .value.accent { fill:#b85c38; } .value.good { fill:#557a61; }
    .dot { fill:#2f302d; } .dot.accent { fill:#b85c38; } .dot.good { fill:#557a61; } .line { stroke:#c9c5bb; stroke-width:1.5; stroke-dasharray:4 6; }
  </style><text x="185" y="78" class="value accent" text-anchor="middle">before</text><g class="node "><rect x="55" y="112" width="105" height="52" rx="8"/><text x="107.5" y="142" class="node-title" text-anchor="middle">event ring</text></g><g class="node warn"><rect x="230" y="112" width="146" height="52" rx="8"/><text x="303" y="133" class="node-title" text-anchor="middle">one consumer</text><text x="303" y="151" class="node-note" text-anchor="middle">all 250 clients</text></g><g class="node "><rect x="470" y="112" width="190" height="52" rx="8"/><text x="565" y="133" class="node-title" text-anchor="middle">client lanes</text><text x="565" y="151" class="node-note" text-anchor="middle">one after another</text></g><path class="arrow " d="M 160 138 L 230 138" marker-end="url(#arrow)"/><path class="arrow " d="M 376 138 L 470 138" marker-end="url(#arrow)"/>
      <path class="line" d="M40 204 L720 204"/><text x="380" y="236" class="value good" text-anchor="middle">after</text><g class="node good"><rect x="320" y="250" width="120" height="52" rx="8"/><text x="380" y="271" class="node-title" text-anchor="middle">event ring</text><text x="380" y="289" class="node-note" text-anchor="middle">one cursor per shard</text></g>
      <g class="node good"><rect x="55" y="342" width="100" height="50" rx="8"/><text x="105" y="362" class="node-title" text-anchor="middle">shard 0</text><text x="105" y="380" class="node-note" text-anchor="middle">0 mod 4</text></g><g class="node good"><rect x="230" y="342" width="100" height="50" rx="8"/><text x="280" y="362" class="node-title" text-anchor="middle">shard 1</text><text x="280" y="380" class="node-note" text-anchor="middle">1 mod 4</text></g><g class="node good"><rect x="405" y="342" width="100" height="50" rx="8"/><text x="455" y="362" class="node-title" text-anchor="middle">shard 2</text><text x="455" y="380" class="node-note" text-anchor="middle">2 mod 4</text></g><g class="node good"><rect x="580" y="342" width="100" height="50" rx="8"/><text x="630" y="362" class="node-title" text-anchor="middle">shard 3</text><text x="630" y="380" class="node-note" text-anchor="middle">3 mod 4</text></g>
      <path class="arrow " d="M 337 302 L 105 342" marker-end="url(#arrow)"/><path class="arrow " d="M 369 302 L 280 342" marker-end="url(#arrow)"/><path class="arrow " d="M 401 302 L 455 342" marker-end="url(#arrow)"/><path class="arrow " d="M 433 302 L 630 342" marker-end="url(#arrow)"/>
      <text x="380" y="414" class="caption" text-anchor="middle">Each client remains assigned to one shard.</text></svg>