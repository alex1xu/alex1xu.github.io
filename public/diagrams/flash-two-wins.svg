      <g class="node warn"><rect x="66" y="112" width="250" height="62" rx="8"/><text x="191" y="138" class="node-title" text-anchor="middle">naive</text><text x="191" y="156" class="node-note" text-anchor="middle">~137 GB → OOM</text></g><g class="node good"><rect x="66" y="206" width="250" height="62" rx="8"/><text x="191" y="232" class="node-title" text-anchor="middle">tiled scalar</text><text x="191" y="250" class="node-note" text-anchor="middle">2.15 GB → fits</text></g><g class="node good"><rect x="66" y="300" width="250" height="62" rx="8"/><text x="191" y="326" class="node-title" text-anchor="middle">WMMA tiled</text><text x="191" y="344" class="node-note" text-anchor="middle">2.15 GB → fits</text></g>
      <g class="node "><rect x="442" y="112" width="250" height="62" rx="8"/><text x="567" y="138" class="node-title" text-anchor="middle">naive</text><text x="567" y="156" class="node-note" text-anchor="middle">54 TFLOP/s</text></g><g class="node warn"><rect x="442" y="206" width="250" height="62" rx="8"/><text x="567" y="232" class="node-title" text-anchor="middle">tiled scalar</text><text x="567" y="250" class="node-note" text-anchor="middle">5 TFLOP/s</text></g><g class="node accent"><rect x="442" y="300" width="250" height="62" rx="8"/><text x="567" y="326" class="node-title" text-anchor="middle">WMMA tiled</text><text x="567" y="344" class="node-note" text-anchor="middle">21 TFLOP/s</text></g>
      <path class="arrow accent" d="M 191 174 L 191 204" marker-end="url(#arrow)"/><path class="arrow accent" d="M 191 268 L 191 298" marker-end="url(#arrow)"/><path class="arrow warn" d="M 567 174 L 567 204" marker-end="url(#arrow)"/><path class="arrow accent" d="M 567 268 L 567 298" marker-end="url(#arrow)"/>
      <text x="380" y="399" class="caption" text-anchor="middle">Tiling removes the allocation. Tensor cores recover some speed. SDPA is still ~200 TF.</text></svg>