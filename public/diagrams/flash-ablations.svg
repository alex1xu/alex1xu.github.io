  </style><text x="132" y="78" class="caption" text-anchor="middle">question</text><text x="380" y="78" class="caption" text-anchor="middle">measurement</text><text x="628" y="78" class="caption" text-anchor="middle">result</text>
      <g class="node "><rect x="42" y="103" width="180" height="58" rx="8"/><text x="132" y="136" class="node-title" text-anchor="middle">softmax is costly</text></g><g class="node "><rect x="290" y="103" width="180" height="58" rx="8"/><text x="380" y="127" class="node-title" text-anchor="middle">remove it</text><text x="380" y="145" class="node-note" text-anchor="middle">52 → 51 ms</text></g><g class="node good"><rect x="538" y="103" width="180" height="58" rx="8"/><text x="628" y="127" class="node-title" text-anchor="middle">~2%</text><text x="628" y="145" class="node-note" text-anchor="middle">not the main cost</text></g>
      <g class="node "><rect x="42" y="193" width="180" height="58" rx="8"/><text x="132" y="226" class="node-title" text-anchor="middle">need more warps</text></g><g class="node "><rect x="290" y="193" width="180" height="58" rx="8"/><text x="380" y="217" class="node-title" text-anchor="middle">pad shared memory</text><text x="380" y="235" class="node-note" text-anchor="middle">2–10 blocks / SM</text></g><g class="node good"><rect x="538" y="193" width="180" height="58" rx="8"/><text x="628" y="217" class="node-title" text-anchor="middle">plateau after 5</text><text x="628" y="235" class="node-note" text-anchor="middle">not occupancy</text></g>
      <g class="node "><rect x="42" y="283" width="180" height="58" rx="8"/><text x="132" y="316" class="node-title" text-anchor="middle">bookkeeping dominates</text></g><g class="node "><rect x="290" y="283" width="180" height="58" rx="8"/><text x="380" y="307" class="node-title" text-anchor="middle">K/V tile: 16 → 64</text><text x="380" y="325" class="node-note" text-anchor="middle">14.7 → 21 TF</text></g><g class="node good"><rect x="538" y="283" width="180" height="58" rx="8"/><text x="628" y="307" class="node-title" text-anchor="middle">smaller gain</text><text x="628" y="325" class="node-note" text-anchor="middle">not enough alone</text></g>
