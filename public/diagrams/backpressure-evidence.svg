<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Journal backpressure and evidence</title><desc id="desc">Journal backpressure and evidence</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6"/></marker></defs>
  <style>
    svg { background: #fffdf8; } .node rect { fill:#fffdf8; stroke:#2f302d; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .node.accent rect,.accent { stroke:#b85c38; fill:#fff1e8; } .node.good rect,.good { stroke:#557a61; fill:#edf5ed; } .node.warn rect,.warn { stroke:#a45a35; fill:#fff0e8; }
    .arrow { fill:none; stroke:#2f302d; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; } .arrow.dashed { stroke-dasharray:7 6; } .arrow.accent { stroke:#b85c38; }
    .label,.node-title,.node-note,.caption,.value { fill:#2f302d; font-family: ui-rounded, 'Comic Sans MS', sans-serif; } .label { font-size:16px; font-weight:650; } .node-title { font-size:16px; font-weight:700; } .node-note { font-size:12px; fill:#62645e; } .caption { font-size:14px; fill:#62645e; } .value { font-size:14px; font-weight:700; } .value.accent { fill:#b85c38; } .value.good { fill:#557a61; }
    .dot { fill:#2f302d; } .dot.accent { fill:#b85c38; } .dot.good { fill:#557a61; } .line { stroke:#c9c5bb; stroke-width:1.5; stroke-dasharray:4 6; }
  </style><text x="190" y="78" class="value accent" text-anchor="middle">before: disk gates admission</text><g class="node "><rect x="40" y="110" width="100" height="56" rx="8"/><text x="90" y="142" class="node-title" text-anchor="middle">orders</text></g><g class="node warn"><rect x="190" y="110" width="128" height="56" rx="8"/><text x="254" y="133" class="node-title" text-anchor="middle">journal</text><text x="254" y="151" class="node-note" text-anchor="middle">fsync</text></g><g class="node warn"><rect x="372" y="110" width="114" height="56" rx="8"/><text x="429" y="133" class="node-title" text-anchor="middle">engine</text><text x="429" y="151" class="node-note" text-anchor="middle">idle</text></g><path class="arrow accent" d="M 140 138 L 190 138" marker-end="url(#arrow)"/><path class="arrow accent" d="M 318 138 L 372 138" marker-end="url(#arrow)"/><text x="254" y="190" class="caption" text-anchor="middle">journal queue fills, so ingress stops</text><g class="node accent"><rect x="500" y="110" width="180" height="56" rx="8"/><text x="590" y="133" class="node-title" text-anchor="middle">server observation</text><text x="590" y="151" class="node-note" text-anchor="middle">126 MB unread orders</text></g>
      <path class="line" d="M40 226 L720 226"/><text x="190" y="258" class="value good" text-anchor="middle">after: tee, then let the journal lag</text><g class="node "><rect x="40" y="290" width="100" height="56" rx="8"/><text x="90" y="322" class="node-title" text-anchor="middle">orders</text></g><g class="node good"><rect x="218" y="290" width="128" height="56" rx="8"/><text x="282" y="313" class="node-title" text-anchor="middle">engine</text><text x="282" y="331" class="node-note" text-anchor="middle">admit now</text></g><g class="node "><rect x="500" y="290" width="128" height="56" rx="8"/><text x="564" y="313" class="node-title" text-anchor="middle">journal</text><text x="564" y="331" class="node-note" text-anchor="middle">copy, off path</text></g><path class="arrow " d="M 140 318 L 218 318" marker-end="url(#arrow)"/><path class="arrow dashed" d="M140 310 Q300 246 500 310" marker-end="url(#arrow)"/><text x="380" y="390" class="caption" text-anchor="middle">The trade-off is explicit: acknowledged orders can be unflushed for a bounded interval.</text></svg>